[project]
name = "canvas-api"
version = "0.1.0"
description = "Backend for yuzu-canva: graph storage, generation jobs, assets"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 96
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
